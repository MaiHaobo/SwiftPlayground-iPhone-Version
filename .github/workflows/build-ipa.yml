name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择最新版 Xcode（带 iOS 26 SDK / 液态玻璃）
        run: |
          ls /Applications | grep Xcode || true
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "使用 $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: 编译（iPhone 真机架构，未签名）
        run: |
          xcodebuild -project SwiftPlayground.xcodeproj \
            -scheme SwiftPlayground \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: 打包 IPA
        run: |
          APP=$(find build/Build/Products -type d -name "SwiftPlayground.app" | head -1)
          echo "找到 App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SwiftPlayground-iPhone.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: SwiftPlayground-iPhone-unsigned-ipa
          path: SwiftPlayground-iPhone.ipa
