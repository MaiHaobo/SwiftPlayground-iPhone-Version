name: WASM Feasibility
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Compile Swift to WASM
        run: |
          cat > run.swift <<'SWIFTEOF'
          print("Hello from real Swift compiled to WASM!")
          var total = 0
          for i in 1...100 { total += i }
          print("1到100的和: \(total)")
          func fact(_ n: Int) -> Int { n <= 1 ? 1 : n * fact(n-1) }
          print("10! = \(fact(10))")
          SWIFTEOF
          docker pull ghcr.io/swiftwasm/swift:swift-wasm-DEVELOPMENT-SNAPSHOT-2026-10-17-a
          docker run --rm -v $PWD:/src -w /src ghcr.io/swiftwasm/swift:swift-wasm-DEVELOPMENT-SNAPSHOT-2026-10-17-a \
            swiftc -target wasm32-unknown-wasip1 -O -o run.wasm run.swift
          ls -la run.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: run-wasm
          path: run.wasm
